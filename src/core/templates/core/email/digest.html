{% comment %} Backyard weekly digest email — design v3 (Signage). Inline hardcoded
   hex only (mail clients strip <style> and CSS variables), table-based, single
   column, ~600px, light-only. Palette derived from the v3 light theme:
     text #1c211e · green #1e5c46 · muted #4c5a52 · faint #5d6a61 · rule #dde4df
   D9 fix: the reply separator and the anti-phishing notice were #8a8f98
   (3.25:1); they are now #5d6a61 (5.68:1). Every Django variable and line of
   copy is unchanged from the shipped template. {% endcomment %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0;padding:0;background-color:#fbfcfb;">
 <tr>
  <td align="center" style="padding:24px 12px;">
   {% comment %} FLUID UP TO 600px, not pinned at it. Measured at a 390px viewport on
      2026-09-19: the pinned card needed 632 CSS px and clipped the body text of every post
      at the right edge ("Sorry it took a fortnigh..."). This is the one surface the whole
      family receives every week, and it was the only object in the product that did not
      fit a phone. `width="100%"` with `max-width:600px` is honoured by every modern client;
      Outlook's Word engine on Windows ignores `max-width`, so the MSO-only ghost table
      below pins the card to 600px there instead of letting it stretch across a maximised
      window. The outer cell's `align="center"` still centres it on a desktop. {% endcomment %}
   <!--[if mso]><table role="presentation" width="600" align="center" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
   <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background-color:#ffffff;border:1px solid #dde4df;border-radius:10px;">
    <tr>
     <td style="padding:26px 30px 30px;font-family:Georgia,'Iowan Old Style',Palatino,serif;font-size:18px;line-height:1.5;color:#1c211e;">

      <div style="margin:0 0 16px;">
        <span style="display:inline-block;vertical-align:middle;line-height:0;"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 3.4 L20.6 10.8 V20.6 H3.4 V10.8 Z M9.7 20.6 V14.8 A2.3 2.3 0 0 1 14.3 14.8 V20.6 Z" fill="#1e5c46"/></svg></span>
        <span style="display:inline-block;vertical-align:middle;font-family:Georgia,serif;font-weight:700;font-size:20px;color:#1e5c46;letter-spacing:-0.01em;">&nbsp;Backyard</span>
      </div>

      <h1 style="font-size: 24px; color: #1e5c46; margin: 0 0 4px; font-family: Georgia, 'Iowan Old Style', Palatino, serif; line-height: 1.2;">New In {{ header.yard_name }}</h1>
      <p style="color: #4c5a52; margin: 0 0 8px;">{{ header.window_text }}</p>

      {% for block in post_blocks %}
        <div style="margin: 24px 0; padding: 16px 0 0; border-top: 1px solid #dde4df;">
          <p style="margin: 0 0 6px; color: #4c5a52;">{{ block.author_line }} · {{ block.date_text }}</p>
          <p style="font-size: 18px; margin: 0 0 8px; white-space: pre-wrap;">{{ block.body }}</p>
          <p style="margin: 0;">
            {% if block.photo_count %}{{ block.photo_count }} photo{{ block.photo_count|pluralize }} ·{% endif %}
            {% if block.reply_count %}{{ block.reply_count }} repl{{ block.reply_count|pluralize:"y,ies" }} ·{% endif %}
            <a href="{{ block.url }}" style="color: #1e5c46;">Open This Post</a>
          </p>
          {% if block.reply_url %}
            {% comment %} The link, and nothing after it. The sentence that used to follow
               ("your reply goes to everyone who can see this post, and you can add photos")
               explained the two things a reply already does everywhere else in the product.
            {% endcomment %}
            <p style="font-size: 16px; margin: 8px 0 0;">
              <a href="{{ block.reply_url }}" style="color: #1e5c46;">Reply In Backyard</a></p>
          {% endif %}
        </div>
      {% endfor %}

      {% if dates_block %}
        <div style="margin: 24px 0; padding: 16px 0 0; border-top: 1px solid #dde4df;">
          <p style="margin: 0;"><strong>Coming Up In The Next Week</strong></p>
          <ul style="margin: 8px 0 0; padding-left: 22px;">
            {% comment %} A straight apostrophe, the same one the plain-text part writes.
               `&rsquo;` here and `'` there was one string spelled two ways. {% endcomment %}
            {% for entry in dates_block.entries %}
              <li style="margin: 2px 0;">{{ entry.name_line }}'s {{ entry.kind }} ({{ entry.date_text }})</li>
            {% endfor %}
          </ul>
        </div>
      {% endif %}

      {% comment %} THE HONEST NAME FOR THIS LINK. It read "See everything in your
         backyard", which a reader takes for the feed; it is `/d/<token>/`, the web copy of
         this one message. {% endcomment %}
      <p style="margin: 24px 0 0;"><a href="{{ footer.digest_url }}" style="color: #1e5c46;">View In Your Browser</a></p>
      {% comment %} WHY THIS ARRIVED. Read as a first-time relative, 2026-09-19: the
         message never said who had signed them up for it or why it turned up, which is the
         first question anybody asks of an e-mail they did not expect, and the one that
         decides whether it is reported as spam. The way out sits with it, because "why you
         got this" and "how to stop it" are one question.

         It says nothing about replying BY E-MAIL, and that absence is deliberate (walk
         item 33). That route was retired for relatives when #101 stopped putting a
         per-post reply address in the message — nothing hands anybody an address any
         more, so a plain reply cannot be routed to a post and lands in the admin-only
         "Held Replies" instead. The way to answer is "Reply In Backyard" on
         each post above, which opens the thread. {% endcomment %}
      <p style="font-size: 16px; color: #4c5a52; margin: 14px 0 0;">You are receiving this
        because Email Updates is on.</p>
      <p style="font-size: 16px; margin: 10px 0 0;">
        <a href="{{ footer.unsubscribe_url }}" style="color: #1e5c46;">Turn Off Email Updates</a></p>
      <p style="font-size: 14px; color: #5d6a61; margin: 14px 0 0;">{{ footer.standing_text }}</p>

     </td>
    </tr>
   </table>
   <!--[if mso]></td></tr></table><![endif]-->
  </td>
 </tr>
</table>
