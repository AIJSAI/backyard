{% extends "core/base.html" %}
{% block title %}Notifications{% endblock %}
{% block body %}
  <h1>Notifications</h1>
  <p class="muted">
    Backyard never sends you anything unless you ask. The one thing you can turn on
    is a nudge when someone replies to your own post.
  </p>
  <p class="back-link"><a class="back" href="{% url 'profile_edit' %}">Back to Settings</a></p>
  <form method="post" action="{% url 'notification_settings' %}">
    {% csrf_token %}
    <label class="inline-check">
      <input type="checkbox" name="notify_on_reply"{% if pref.notify_on_reply %} checked{% endif %}>
      Tell me when someone replies to my post
    </label>
    <button type="submit">Save</button>
  </form>
{% endblock %}
