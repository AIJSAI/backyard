{% comment %} The rules for core/_install_steps.html, in the HEAD where a <style> belongs.
   Each page that includes the steps includes this from its `extra_head` block, the way
   feed.html carries its own rules. {% endcomment %}
<style>
/* Scoped to this block. The steps are a numbered list with the numbers at the page's own
   left edge rather than the browser's 40px indent, so the three steps line up with the
   heading above them instead of floating in from the side. */
.install ol { margin: 0 0 1.1rem; padding-left: 1.35rem; }
.install li { margin: 0 0 0.45rem; padding-left: 0.15rem; }
.install li:last-child { margin-bottom: 0; }
.install section { margin: 0 0 2rem; }
/* The glyph iOS draws on the Share control, at the size of the word beside it. `baseline`
   would sit it low against the text; -0.18em is the optical centre of a 1.15em box. */
.install .share-glyph { width: 1.15em; height: 1.15em; vertical-align: -0.18em; margin: 0 0.1em; }
/* `hidden` is overridden by any later rule that sets `display`, so every element this
   block toggles names the attribute at a specificity that wins. Without this a branch
   that is meant to be invisible renders anyway, which is the one failure mode a
   progressive-enhancement block must not have. */
.install [hidden] { display: none; }
.install-now { margin: 0 0 2rem; }
.install-now p { margin: 0 0 0.6rem; }
</style>
