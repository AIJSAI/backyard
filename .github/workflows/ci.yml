name: gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/check_stories.py
      # TM-2 drift-guard: the digest builder reads only through the audience
      # guard; the script self-tests its patterns so it can never go vacuous.
      - run: python scripts/check_digest_confinement.py

  code:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: backyard
          POSTGRES_USER: backyard
          POSTGRES_PASSWORD: ci-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backyard"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      # Non-placeholder value so settings.py boots; not a real secret, low entropy on purpose.
      DJANGO_SECRET_KEY: ci-not-a-secret-deadbeef-cafe-1234567890
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: ci-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.6"
      - run: uv sync --frozen
      - name: Lint
        run: |
          # scripts/ and docs/design/tools/ were never linted, which is why the
          # `# noqa: S105` on the leaked password line was decorative -- a suppression
          # for a linter that never ran on that file. Security rules now run there;
          # formatting stays src-only to avoid churning generated-ish tooling.
          uv run ruff check src
          # NOT extended to scripts/ + docs/design/tools/ for credentials. Measured: ruff's
          # S105/S106/S107 caught NONE of `PW =`, `PASSWORD =`, `password =`, `SECRET =` or
          # `passphrase =` as bare assignments, so such a step would be decorative -- the same
          # defect as the `# noqa: S105` that sat beside the leaked password for a linter that
          # never ran on that file. Those directories are covered instead by the bandit pass in
          # `deps` and by src/core/tests/test_no_hardcoded_demo_credentials.py, both of which
          # were probed and do fire.
          uv run ruff format --check src
      - name: Typecheck
        run: uv run mypy src
      - name: Install ffmpeg (S-402 video transcode tests run against the real binary)
        # The transcode tests exercise the actual ffmpeg/ffprobe, so the gate is not
        # vacuous: without the binary they would skip and hide a regression. The image
        # ships ffmpeg (Dockerfile); the bare test runner needs it installed here.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Tests
        run: uv run pytest
      - name: Deploy check (production-like posture, fail on any warning)
        # Catches a regression in deployment security posture (threat model TS-DJ-10): secure
        # cookies, HSTS, SSL redirect, DEBUG off. Run against a production-like env so the
        # HTTPS-keyed hardening engages; the key here is long enough to pass W009 and is not a
        # real secret.
        env:
          DJANGO_DEBUG: "0"
          BACKYARD_BASE_URL: https://ci.example.com
          DJANGO_ALLOWED_HOSTS: ci.example.com
          DJANGO_SECRET_KEY: ci-deploy-check-not-a-secret-0123456789abcdef0123456789abcdef
        run: uv run python manage.py check --deploy --fail-level WARNING
      - name: Docker build
        run: docker build -t backyard:ci .
      - name: Compose live probe (ADR-004 role split, first-run boot)
        # Boots the real compose stack and proves the role split live, both ways, so the
        # gate is not vacuous (TS-PG-1): the app role cannot DDL, the migrator can, and the
        # full first-run path (migrate as migrator, gunicorn as app, healthz through Caddy)
        # works end to end. Passwords are throwaway CI values, not secrets.
        env:
          POSTGRES_PASSWORD: ci-not-a-secret
          POSTGRES_MIGRATOR_PASSWORD: ci-migrator-not-a-secret
          POSTGRES_APP_PASSWORD: ci-app-not-a-secret
          # Without this the entrypoint's ENCRYPT branch never executes, and the
          # pre-flight assertion below silently tests the plaintext path instead --
          # i.e. the gate depended on backups staying unencrypted, so setting the
          # passphrase on a real instance would have BROKEN CI. Throwaway CI value.
          BACKYARD_BACKUP_PASSPHRASE: ci-backup-passphrase-not-a-secret
        run: |
          set -eu
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/healthz
          echo "--- app role is unprivileged ---"
          docker compose exec -T postgres psql -U backyard_app -d backyard -tAc \
            "SELECT current_setting('is_superuser')" | grep -qx off
          if docker compose exec -T postgres psql -U backyard_app -d backyard \
               -c 'CREATE TABLE probe_should_fail (x int)'; then
            echo "VACUOUS GATE: backyard_app can run DDL"; exit 1
          fi
          echo "--- migrator can DDL (probe is non-vacuous) ---"
          docker compose exec -T postgres psql -U backyard_migrator -d backyard \
            -c 'CREATE TABLE probe_migrator_ok (x int); DROP TABLE probe_migrator_ok;'
          echo "--- migrator creds are gone from the running server's env ---"
          # exec'd processes get the container's configured env, so probe PID 1 (gunicorn,
          # exec'd after the entrypoint's unset): its environ must not hold the migrator
          # password, so an RCE in the web process cannot read DDL credentials.
          if docker compose exec -T web sh -c \
               'tr "\0" "\n" < /proc/1/environ | grep -q "^POSTGRES_MIGRATOR_PASSWORD="'; then
            echo "LEAK: migrator password still in the gunicorn process env"; exit 1
          fi
          echo "--- edge cannot even resolve the database (TS-CO-4 network split) ---"
          # Compose DNS resolves a service name only for containers sharing a network,
          # so caddy (edge only) cannot resolve postgres (web-db only): NXDOMAIN.
          if docker compose exec -T caddy nslookup postgres >/dev/null 2>&1; then
            echo "LEAK: caddy can resolve postgres across the network split"; exit 1
          fi
          docker compose exec -T web sh -c \
            'python -c "import socket; socket.create_connection((\"postgres\",5432),3)"' \
            || { echo "web cannot reach postgres (split too aggressive)"; exit 1; }
          echo "--- pre-flight backup ran before migrate, and is ENCRYPTED (TS-CO-2, T-BACKUP-1) ---"
          # This used to assert `preflight-*.dump`, which the ENCRYPTED branch never
          # writes (it produces .dump.enc and rm -f's the plaintext). Both halves are
          # asserted so the check cannot pass in the wrong configuration: the ciphertext
          # must exist AND no plaintext dump may be left behind.
          docker compose exec -T web sh -c 'ls /data/backups/preflight-*.dump.enc' | grep -q preflight
          if docker compose exec -T web sh -c 'ls /data/backups/preflight-*.dump' 2>/dev/null | grep -q '\.dump$'; then
            echo "LEAK: a PLAINTEXT pre-flight dump of the whole database remains on the volume"; exit 1
          fi
          # It must be real ciphertext, not an empty or truncated file: a pg_dump custom
          # archive starts with the magic "PGDMP", and the encrypted one must not.
          if docker compose exec -T web sh -c 'head -c 5 /data/backups/preflight-*.dump.enc' | grep -q PGDMP; then
            echo "NOT ENCRYPTED: the .enc pre-flight dump is a plaintext PGDMP archive"; exit 1
          fi
          echo "--- the app role can read AND write the rate-limit cache (TS-DJ-13) ---"
          # As the real backyard_app runtime role, not a superuser: proves the ADR-004
          # default-privilege grant reaches backyard_cache, so allauth's shared rate
          # limit actually works in production (security review MEDIUM-4). A fresh exec
          # gets the container env (backyard_app creds) but not the runtime-generated
          # DJANGO_SECRET_KEY, which lives only in PID 1; source it from the persisted file.
          docker compose exec -T web sh -c 'DJANGO_SECRET_KEY="$(cat /data/secret_key)" python manage.py shell -c "from django.core.cache import cache; cache.set(\"ci-probe\", \"ok\", 30); assert cache.get(\"ci-probe\") == \"ok\"; print(\"app-role cache write OK\")"'
          echo "--- no migrator-owned SECURITY DEFINER routine (PR #46 review LOW-1) ---"
          # The EXECUTE-ON-ROUTINES grant to backyard_app is safe ONLY while the migrator
          # owns no SECURITY DEFINER function: such a function would run with migrator's
          # DDL rights, and the blanket default-privilege would silently hand the app role
          # EXECUTE on it. Pin the invariant here, non-vacuously: there ARE migrator-owned
          # routines (Procrastinate's ~18), and ZERO of them are SECURITY DEFINER.
          MIGRATOR_ROUTINES=$(docker compose exec -T postgres psql -U backyard_migrator -d backyard -tAc \
            "SELECT count(*) FROM pg_proc p JOIN pg_roles r ON p.proowner=r.oid WHERE r.rolname='backyard_migrator'")
          [ "$MIGRATOR_ROUTINES" -gt 0 ] || { echo "probe vacuous: migrator owns no routines"; exit 1; }
          SECDEF=$(docker compose exec -T postgres psql -U backyard_migrator -d backyard -tAc \
            "SELECT count(*) FROM pg_proc p JOIN pg_roles r ON p.proowner=r.oid WHERE r.rolname='backyard_migrator' AND p.prosecdef")
          [ "$SECDEF" = "0" ] || { echo "LEAK: migrator owns $SECDEF SECURITY DEFINER routine(s); app role EXECUTE is an escalation path"; exit 1; }
          echo "migrator owns $MIGRATOR_ROUTINES routines, 0 SECURITY DEFINER (grant is safe)"

          echo "--- backup -> restore round trip against a REAL Postgres (S-802, S-704) ---"
          # Until this existed, `pg_restore` had never executed anywhere: the unit tests
          # stub pg_dump/pg_restore entirely, and production has never taken a backup. The
          # first real restore would have happened on the day the data was already gone.
          # A Yard is the isolation primitive, so its survival is a meaningful assertion
          # rather than a row count.
          RUNSHELL='DJANGO_SECRET_KEY="$(cat /data/secret_key)" python manage.py'
          docker compose exec -T web sh -c "$RUNSHELL shell -c \"
          from core.models import Yard
          Yard.objects.create(name='CI Roundtrip Yard', slug='ci-roundtrip')
          print('seeded', Yard.objects.filter(slug='ci-roundtrip').count())\""

          docker compose exec -T web sh -c "$RUNSHELL backup_instance /data/backups/ci-roundtrip.bak"

          # The archive must be encrypted at rest by DEFAULT, with no --no-encrypt passed.
          # Asserted on backup_crypto's magic header rather than on `tar -tf` failing:
          # a missing `tar` in the image would make a failure-based check pass vacuously,
          # which is the exact defect class that let three gates prove the wrong thing.
          MAGIC=$(docker compose exec -T web sh -c 'head -c 14 /data/backups/ci-roundtrip.bak')
          [ "$MAGIC" = "BACKYARD-ENC/1" ] || {
            echo "NOT ENCRYPTED: archive header is '$MAGIC', expected BACKYARD-ENC/1"; exit 1; }

          # Destroy the marker, so a restore that silently does nothing cannot pass.
          docker compose exec -T web sh -c "$RUNSHELL shell -c \"
          from core.models import Yard
          Yard.objects.filter(slug='ci-roundtrip').delete()
          assert Yard.objects.filter(slug='ci-roundtrip').count() == 0
          print('marker deleted')\""

          docker compose exec -T web sh -c "$RUNSHELL restore_instance /data/backups/ci-roundtrip.bak --force"

          docker compose exec -T web sh -c "$RUNSHELL shell -c \"
          from core.models import Yard
          n = Yard.objects.filter(slug='ci-roundtrip').count()
          assert n == 1, f'restore did not bring the yard back: {n}'
          print('RESTORE VERIFIED: the yard survived the round trip')\""

          docker compose down -v

  e2e:
    # S-101 cross-browser mobile onboarding: the join -> feed flow driven in the real
    # browser ENGINES iOS Safari (WebKit) and Android Chrome (Chromium) use, under mobile
    # device emulation, against a live server. Its own job because it needs the Playwright
    # browsers; excluded from the unit `code` job via the `-m 'not e2e'` default.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: backyard
          POSTGRES_USER: backyard
          POSTGRES_PASSWORD: ci-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backyard"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci-not-a-secret-deadbeef-cafe-1234567890
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: ci-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.6"
      - run: uv sync --frozen
      - name: Install Playwright browsers (WebKit + Chromium) with system deps
        run: uv run playwright install --with-deps webkit chromium
      - name: Mobile onboarding e2e (iOS Safari + Android Chrome)
        # -m e2e overrides the pyproject default `-m 'not e2e'`, so ONLY the e2e tests run;
        # they must actually run here (both engines), so the gate is not vacuous.
        run: uv run pytest -m e2e -v

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          # Retry: the release download occasionally resets mid-transfer.
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o /tmp/gitleaks.tgz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c - \
            || { echo "gitleaks checksum mismatch"; exit 1; }
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Selftest, per-rule, against THIS repo's config and its most-exempted path
        # Rewritten twice. Version 1 planted in a bare $RUNNER_TEMP repo with no
        # .gitleaks.toml, so gitleaks discovered no config and the selftest exercised the
        # DEFAULT ruleset -- proving the binary works while our own config hid a live
        # credential. Version 2 planted inside the real tree but used a password value that
        # our own allowlist exempts, so the AWS half alone made the gate fail and the
        # low-entropy half proved nothing. Review caught that; it is the same wrong-class
        # defect this job exists to prevent, twice.
        #
        # So: assert PER RULE. Each plant must be attributed to the specific rule that is
        # supposed to catch it, or one half can never silently carry the other.
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/leakprobe"
          rm -rf "$probe" && cp -r . "$probe" && cd "$probe"
          # Provider-shaped key -> must be caught by gitleaks' own aws rule.
          # Low-entropy human password, deliberately NOT in our allowlist -> must be caught
          # by our backyard-generic-password-assignment rule. That is the class that leaked.
          printf 'aws_access_key_id = AKIA''Q3EGRIJKZVYWXHNM\n' > src/core/tests/test_zz_probe.py
          printf '%s = "%s"\n' PW sunflower-kitchen-tuesday >> src/core/tests/test_zz_probe.py
          git config user.email ci@local && git config user.name ci
          git add -f src/core/tests/test_zz_probe.py
          git commit -qm "plant (selftest, never pushed)"
          gitleaks git --no-banner -c "$probe/.gitleaks.toml" -f json -r "$probe/out.json" "$probe" || true
          python3 - "$probe/out.json" <<'PY'
          import json, sys
          rules = {f["RuleID"] for f in json.load(open(sys.argv[1]))}
          required = {"aws-access-token", "backyard-generic-password-assignment"}
          missing = required - rules
          if missing:
              print(f"VACUOUS GATE: this repo's gitleaks config did not fire {sorted(missing)} "
                    f"on a plant in src/core/tests/. Rules that did fire: {sorted(rules)}",
                    file=sys.stderr)
              raise SystemExit(1)
          print(f"gate proven per-rule: {sorted(required)}")
          PY
      - name: Scan full history
        # -c is explicit rather than discovered, so this and the selftest above can
        # never diverge on which ruleset they used.
        run: gitleaks git --no-banner --redact -c .gitleaks.toml .

  deps:
    # S-726: dependency-CVE scan (pip-audit) + SAST (bandit). Both prove themselves
    # non-vacuous on every run (the gitleaks lesson): a planted vulnerable package and a
    # planted eval MUST be caught, or the build fails, so a broken scanner can never go
    # silently green. This gate is what caught the Pillow 11.3 image-decoder CVEs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.6"
      - run: uv sync --frozen
      - name: Dependency CVE scan (pip-audit against the installed dependency set)
        # Audits the real synced deps against the PyPI/OSV advisory DB. PYSEC-2026-1845
        # (pytest) is ignored with a reason: pytest is a dev-only test tool, NOT in the
        # production runtime, and the pytest-9 major bump would break the pinned
        # pytest-django / pytest-playwright harness. Everything shipped to a family box is
        # scanned; a new advisory on a runtime dep fails the build.
        run: uv run --with pip-audit pip-audit --progress-spinner off --ignore-vuln PYSEC-2026-1845
      - name: Dep-scan self-test (a planted vulnerable package MUST be caught)
        run: |
          if uv run --with 'jinja2==2.11.2' --with pip-audit pip-audit --progress-spinner off >/dev/null 2>&1; then
            echo "VACUOUS GATE: pip-audit passed a known-vulnerable jinja2 2.11.2" >&2
            exit 1
          fi
      - name: SAST (bandit on production code, medium+ severity and confidence)
        # Tests carry asserts + fixture IPs (bandit B101/B104 noise) and migrations are
        # autogenerated, so both are excluded; the one production medium+ finding, the QR
        # mark_safe in core/handover.py, is nosec'd at the line with its justification
        # (qrcode path geometry over a CSPRNG token, never reflected user text).
        run: uvx bandit==1.9.2 -r src --exclude src/core/tests,src/core/migrations --severity-level medium --confidence-level medium -q
      - name: SAST, hardcoded credentials at ANY severity
        # B105/B106/B107 are all rated LOW by bandit, so the medium floor above filtered
        # out the entire hardcoded-credential family -- the exact class that leaked a live
        # password from this repo. Measured: `PASSWORD = "..."` is reported with no floor
        # and silently dropped at --severity-level medium. This pass has no floor and is
        # scoped to those three tests, so it adds no noise.
        # Measured coverage: catches PASSWORD/password/SECRET/passphrase assignments and both
        # the kwarg (B106) and default-argument (B107) forms. Blind spot, named rather than
        # assumed away: it does NOT catch `PW = "..."` -- the exact name that leaked here. That
        # shape is covered by test_no_hardcoded_demo_credentials.py (ast, includes "pw") and by
        # the backyard-generic-password-assignment rule in .gitleaks.toml. Three layers, and
        # this comment records which one covers what.
        # Tests excluded: their fixtures are synthetic and are covered instead by
        # test_no_hardcoded_demo_credentials.py, which allowlists them BY VALUE, so a
        # genuinely new secret in a test file still fires. That is why excluding them here
        # does not recreate the blind spot the path-based gitleaks allowlist did.
        # The four production hits are empty-string credential CLEARS (revocation), each
        # annotated with a scoped `# nosec B10x` and its reason.
        run: uvx bandit==1.9.2 -r src scripts docs/design/tools --exclude src/core/migrations,src/core/tests -t B105,B106,B107 -q
      - name: SAST self-test (a planted eval AND a planted password MUST be caught)
        # The eval() plant is B307/Medium, so it only ever proved the medium floor works --
        # the same wrong-class proof as the old gitleaks selftest. The second plant is the
        # class that actually leaked, and it is checked against the no-floor invocation.
        run: |
          set -euo pipefail
          printf 'x = eval(input())\n' > "$RUNNER_TEMP/sast-probe.py"
          if uvx bandit==1.9.2 "$RUNNER_TEMP/sast-probe.py" --severity-level medium --confidence-level medium -q >/dev/null 2>&1; then
            echo "VACUOUS GATE: bandit passed a planted eval()" >&2
            exit 1
          fi
          # Built from printf args so this FILE contains no credential-shaped assignment:
          # the local pre-commit hook correctly refused the literal form, which is the hook
          # doing its job on the very plant that proves bandit does its job.
          printf '%s = "%s"\n' PASSWORD a-password-a-person-chose > "$RUNNER_TEMP/pw-probe.py"
          if uvx bandit==1.9.2 "$RUNNER_TEMP/pw-probe.py" -t B105,B106,B107 -q >/dev/null 2>&1; then
            echo "VACUOUS GATE: bandit passed a planted hardcoded password" >&2
            exit 1
          fi
