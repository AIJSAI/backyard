name: backyard

# Bounded, rotating logs on every service: the default json-file driver never rotates, so on a
# small VPS unbounded logs are a disk-fill vector and permanent plaintext retention (threat model
# TS-CO-1). Applied to all services below via the anchor.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # Pinned by digest (T-UPGRADE-1): tag + digest, never a floating tag alone.
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backyard}
      # The bootstrap superuser: initdb, healthchecks, and pg_dump backups only.
      # The application never connects as it (ADR-004 role split, TS-PG-1).
      POSTGRES_USER: ${POSTGRES_USER:-backyard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?set POSTGRES_MIGRATOR_PASSWORD in .env, see .env.example}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env, see .env.example}
    volumes:
      # Postgres 18 places data in a versioned subdirectory; mount the parent, not /data.
      - pgdata:/var/lib/postgresql
      # First-boot role split (ADR-004): backyard_migrator (DDL) / backyard_app (DML).
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backyard} -d ${POSTGRES_DB:-backyard}"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [web-db, worker-db]
    # No published port, and no shared network with the edge: only web and the
    # worker, each on its own db network, can address the database (TM-8, TS-CO-4).

  web:
    build: .
    restart: unless-stopped
    logging: *default-logging
    # The web process also touches parsers on upload (Pillow, and ffprobe/strip for the
    # video pre-flight), so it too gets a memory and pid ceiling (TS-CO-6).
    mem_limit: 768m
    pids_limit: 512
    # TS-CO-7 container hardening. cap_drop and no-new-privileges are free here --
    # nothing setuid is needed -- and no-new-privileges specifically blocks the standard
    # post-RCE escalation primitive on the one service that runs parsers over
    # member-uploaded video. read_only is deliberately NOT set yet: it needs collectstatic
    # moved to build time, which is its own change.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      BACKYARD_BASE_URL: ${BACKYARD_BASE_URL:-http://localhost:8000}
      # Outbound + inbound email provider (wave 4). Defaults keep the console backend
      # so an unconfigured compose is unchanged; set these to switch to Anymail/Resend.
      # RESEND_INBOUND_SECRET is the webhook signing secret Anymail verifies (web only).
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-backyard@localhost}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_INBOUND_SECRET: ${RESEND_INBOUND_SECRET:-}
      # Bring-your-own SMTP (README's promise). settings.py reads all six, but until
      # now NONE of them were passed in — compose's .env is substitution-only, so an
      # operator who set EMAIL_BACKEND=...smtp.EmailBackend hit the boot guard's
      # "EMAIL_HOST is empty" and crash-looped with nothing explaining why.
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-0}
      # The backup passphrase (S-802). Documented in .env.example and the self-host
      # guide, and — like the EMAIL_* set before it — it did NOTHING until it was named
      # here: compose's .env is substitution-only. A keyfile is still the tighter option
      # (this value is visible to `docker inspect`), which is what the guide recommends;
      # this exists so the documented .env path is actually true.
      BACKYARD_BACKUP_PASSPHRASE: ${BACKYARD_BACKUP_PASSPHRASE:-}
      POSTGRES_DB: ${POSTGRES_DB:-backyard}
      # Runtime connects as the unprivileged app role (ADR-004, TS-PG-1). The migrator
      # credentials are used for the migrate step only; the entrypoint drops them from
      # the environment before gunicorn starts, so a compromised web process holds only
      # backyard_app. The bootstrap superuser's password never reaches this container.
      POSTGRES_USER: backyard_app
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env, see .env.example}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?set POSTGRES_MIGRATOR_PASSWORD in .env, see .env.example}
      POSTGRES_HOST: postgres
    volumes:
      - appdata:/data
    healthcheck:
      # The app's own /healthz, asked the way a stranger asks it. `python`, not curl: the
      # Dockerfile purges curl after the build, so a curl healthcheck would report every
      # container unhealthy forever. ANY 200 passes, `degraded` included — degraded is a
      # statement about the instance (a filling disk, an ageing backup), and restarting the
      # container fixes none of those while cycling the family's site would.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The first boot migrates and collectstatics before gunicorn binds; without this the
      # container reports unhealthy for its first minute every time it starts.
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
    networks: [edge, web-db]
    # No published port: only the proxy is exposed (threat model TM-8). The app
    # generates and persists its own DJANGO_SECRET_KEY at first boot into appdata.

  worker:
    # The ADR-002 fourth container: the same image, running the Procrastinate
    # worker instead of gunicorn. The entrypoint's role check (TS-CO-3) sees a
    # non-gunicorn command, so it execs directly as backyard_app and never
    # migrates, generates a secret, or races the web boot. It reads the shared
    # secret and media from appdata and reaches the database only on worker-db.
    build: .
    # Concurrency 1: the worker processes one job at a time, so the expensive transcode
    # re-encode never runs in parallel with another (TS-PP-2). At family scale the
    # digest/rollup jobs serialize behind an occasional transcode with no user-visible
    # cost. (The upfront probe/strip run web-side, bounded by their own timeout+rlimits.)
    command: ["python", "manage.py", "procrastinate", "worker", "--concurrency", "1"]
    restart: unless-stopped
    logging: *default-logging
    # A parser bomb (ffmpeg or Pillow) OOMs its own container, not the box (TS-CO-6). The
    # transcode home gets the larger share; sized for the target hardware, founder-tunable.
    mem_limit: 1500m
    pids_limit: 512
    # TS-CO-7, and this is the container that matters most for it: the worker is where
    # ffmpeg runs on member-uploaded video, so it is the likeliest place a decode CVE lands.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      BACKYARD_BASE_URL: ${BACKYARD_BASE_URL:-http://localhost:8000}
      # The worker runs the periodic digest send, so it needs the outbound provider.
      # The boot guard requires RESEND_INBOUND_SECRET wherever the Resend backend is
      # active (TS-PP-8), so it is a deployment-wide secret even though only web serves
      # the inbound webhook — the worker carries it to satisfy the same guard.
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-backyard@localhost}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_INBOUND_SECRET: ${RESEND_INBOUND_SECRET:-}
      # Bring-your-own SMTP (README's promise). settings.py reads all six, but until
      # now NONE of them were passed in — compose's .env is substitution-only, so an
      # operator who set EMAIL_BACKEND=...smtp.EmailBackend hit the boot guard's
      # "EMAIL_HOST is empty" and crash-looped with nothing explaining why.
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-0}
      # The worker takes the nightly backup (core/tasks.scheduled_backup_task), so the
      # passphrase has to reach THIS container too — it was passed to web only, and an
      # unset passphrase makes the scheduled backup refuse to run rather than quietly write
      # the family's whole history in the clear (S-802). Note what is deliberately NOT here:
      # POSTGRES_MIGRATOR_PASSWORD. The worker runs ffmpeg over member-uploaded video and
      # must never hold DDL credentials (TS-CO-3, TS-CO-7); the dump runs as the app role,
      # which ADR-004 already lets read every table (core/backups._dump_credentials).
      #
      # And the COST of putting the passphrase here, stated rather than implied: this is the
      # container that runs ffmpeg on hostile bytes, and it also mounts the volume the
      # ciphertext lives on. A decode RCE now yields the passphrase (PID 1's environ, same
      # uid) AND every archive, including the copies taken off the box — the whole of
      # T-BACKUP-1's confidentiality. Parser children already get an allowlisted env
      # (TS-CO-5), so this is a /proc read after an RCE, not an inherited variable.
      # BACKYARD_BACKUP_PASSPHRASE_FILE (a 0600 key mounted read-only) keeps it out of
      # `docker inspect` and out of the process environment; prefer it on a real instance.
      BACKYARD_BACKUP_PASSPHRASE: ${BACKYARD_BACKUP_PASSPHRASE:-}
      # The keyfile path INSIDE the container, for an operator who followed the self-host
      # guide's tighter recommendation and mounted a 0600 key instead of putting the
      # passphrase in the environment. Without it the nightly backup has no passphrase and
      # refuses every night. Mount the key read-only, and never onto /data.
      BACKYARD_BACKUP_PASSPHRASE_FILE: ${BACKYARD_BACKUP_PASSPHRASE_FILE:-}
      POSTGRES_DB: ${POSTGRES_DB:-backyard}
      POSTGRES_USER: backyard_app
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env, see .env.example}
      POSTGRES_HOST: postgres
    volumes:
      - appdata:/data
    healthcheck:
      # What this proves, exactly: that a process in THIS container can reach the database
      # and sees the Procrastinate schema. That catches the common worker failures -- a
      # wrong DSN, a network split, an unmigrated schema -- and the container dying is
      # already covered by `restart: unless-stopped`.
      #
      # What it does NOT prove: that the worker LOOP is consuming jobs. This check runs in a
      # fresh process, so a wedged worker (a deadlocked job, a hung dump holding the single
      # slot) still reports healthy. The alarm for that case is outside the box: the backup
      # ages past STALE_BACKUP_DAYS, /healthz goes degraded and monitor.yml mails the owner.
      # A real liveness signal would be a worker heartbeat row compared against now().
      #
      # DJANGO_SECRET_KEY lives in PID 1's environment only (the entrypoint reads it from
      # the volume), and a healthcheck is a fresh process, so it reads the same file.
      test: ["CMD-SHELL", "DJANGO_SECRET_KEY=\"$$(cat /data/secret_key)\" python manage.py procrastinate healthchecks"]
      # 120s, not 60s: each run is a full Django boot plus a migration-graph load inside the
      # container that also runs ffmpeg under a 1500m ceiling.
      interval: 120s
      timeout: 20s
      retries: 3
      # web must have migrated the Procrastinate schema before this can pass.
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      # web owns migrations (the single migrator); the worker needs the
      # Procrastinate schema web creates. restart:unless-stopped converges if it
      # starts before web finishes migrating.
      web:
        condition: service_started
    networks: [worker-db]
    # No edge network and no published port: the worker never faces the internet.

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - web
    ports:
      # Bound to loopback: this compose is the local repro, and its Caddy block is plain
      # HTTP. A real deployment publishes 0.0.0.0 with the HTTPS Caddyfile block (TM-8).
      - "127.0.0.1:8000:8000"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    healthcheck:
      # busybox wget: the caddy image is alpine and ships no curl either. Both Caddyfiles
      # answer /healthz on :8000 — the local one as its published proxy, the production one
      # as an internal port compose never publishes — so this single line means the same
      # thing in both stacks instead of passing in one and lying in the other.
      #
      # It proxies through to the app, so caddy reads unhealthy when web is down. That is the
      # intended reading: the edge's job is reaching the application, and "Caddy is up but
      # serves nothing" is the state a process-liveness check would call healthy.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks: [edge]

# The TS-CO-4 split: the internet-facing edge never shares a network with the
# database, so a compromised Caddy cannot address Postgres. web sits on both
# networks because it must reach the database, so postgres CAN still address web
# on web-db (a post-compromise XFF-spoof vector, security review LOW-5); that is
# bounded because an owned Postgres already holds the session table and hashes.
# Fully isolating web behind Caddy needs per-network listen binding Docker does
# not offer for a single port; revisit if it becomes worth a second proxy hop.
networks:
  edge:
  web-db:
  worker-db:

volumes:
  pgdata:
  appdata:
  caddydata:
