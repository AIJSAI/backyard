# Extends the default gitleaks ruleset (never replaces it).
#
# WHY THIS FILE WAS REWRITTEN, 2026-07-30. It used to allowlist the PATH
# `src/core/tests/.*` — all 72 files, every rule — to silence four synthetic fixtures.
# Measured cost of that convenience, on a throwaway repo with one realistic AWS-shaped
# key committed to two paths:
#
#     gitleaks defaults       -> reports scripts/outside.py AND src/core/tests/test_leak.py
#     the old config here     -> reports scripts/outside.py ONLY
#
# So a REAL provider key committed anywhere under src/core/tests/ scanned clean forever.
# Not hypothetical: the remediation for a leaked production password re-published the
# literal into src/core/tests/test_no_hardcoded_demo_credentials.py, where this allowlist
# hid it while every gate reported green.
#
# The old header also claimed the gate was still proven non-vacuous because the CI selftest
# "plants a real-shaped AWS key in a throwaway repo (which this config does not cover)".
# That parenthetical was the defect, not the reassurance: gitleaks discovers its config from
# the scan directory, so a selftest run somewhere else exercises the DEFAULTS and can never
# observe a mistake in this file. The selftest now plants inside a copy of the real tree and
# passes `-c` explicitly, so it measures the config that ships.
#
# Allowlists below are scoped to VALUES, not paths. A new secret in a test file fires; only
# these named synthetic strings are exempt.
[extend]
useDefault = true

[[allowlists]]
description = """Synthetic credential fixtures, enumerated by value rather than by path.
Each is an invented passphrase that exists so the first-run wizard and admin tests can run.
Adding a fixture means naming it here on purpose — which is the point.

SCOPED to this file's two generic rules. It was global: a top-level [[allowlists]] with no
targetRules applies to EVERY rule, including the provider-key rules from the default set. No
exploit was constructed against a provider rule — their key formats cannot contain these
strings — so this is a latent hazard rather than a demonstrated hole. It is still wrong for
a block whose description names a scope to not have one.

`generic-api-key` is in the list because it is MEASURED to be needed, not assumed: scoping
this block to the two backyard rules alone produced 12 findings, all `generic-api-key`, all
on these same fixtures in test_setup / test_admin_views / test_removal. The global scope was
load-bearing rather than accidental — which is exactly why it had to be measured before
being narrowed."""
targetRules = [
  "backyard-generic-password-assignment",
  "backyard-unquoted-env-credential-assignment",
  "generic-api-key",
]
regexes = [
  '''a-Strong-passphrase-9''',
  '''a-fine-passphrase-1234''',
  '''correct-horse-battery-staple-42''',
  '''old-Passphrase-9''',
  '''aX9!mnpq2ffz''',
  '''a-literal-password''',
  '''correct horse battery staple''',
  '''a-drill-migrator-passphrase-1''',
  '''a-fine-password-1234''',
  '''solitude-92''',
]

[[allowlists]]
description = "False positive: the literal phrase 'SHA-256-digest' in a design doc is not a key"
regexes = ['''SHA-256-digest''']

# The class that actually leaked, added as a first-class rule. gitleaks' own generic-api-key
# needs a credential keyword adjacent to a HIGH-ENTROPY value, so `PW = "a-word-someone-chose"`
# never matched — which is exactly the shape a person commits. Low entropy is the point here,
# so this rule has no entropy floor and accepts a short human-readable value.
[[rules]]
id = "backyard-generic-password-assignment"
description = "A credential-shaped name assigned a quoted literal, at any entropy"
regex = '''(?i)[a-z0-9_.-]{0,40}(pw|passwd|password|passphrase|secret|credential)[a-z0-9_.-]{0,40}\s*[:=]\s*["']([^"'$\n]{6,})["']'''
# The VALUE, not the whole `password = "..."` match, so the synthetic-fixture allowlist
# above compares against the credential itself rather than the surrounding syntax.
secretGroup = 2
tags = ["password", "generic"]

[[allowlists]]
description = """False positives of the generic-password rule, enumerated by value.
migrator_pw / app_pw are psql VARIABLE NAMES in postgres/initdb/01-roles.sh
(PASSWORD :'migrator_pw'), interpolated from required env vars -- not credentials.
hunter2 is a deliberate plant in this repo's own guard tests. The CI selftest's password
plant is deliberately NOT allowlisted -- allowlisting it made that half of the proof vacuous. The angle-bracket forms are redaction placeholders written where a
real credential used to be quoted, so the rule that finds credentials also finds the marker
left behind when one is removed.

SCOPED, for the reason above: this block says "of the generic-password rule" and applied to
all of them."""
targetRules = [
  "backyard-generic-password-assignment",
  "backyard-unquoted-env-credential-assignment",
]
regexes = [
  # ANCHORED. These were bare substrings, so any value merely CONTAINING them was
  # allowlisted -- `app_pw` would have exempted a real secret like `app_pw_9fJ2...`.
  # They are psql variable NAMES in postgres/initdb/01-roles.sh, so the whole value is
  # the name and nothing longer should ever match.
  '''^migrator_pw$''',
  '''^app_pw$''',
  '''^hunter2$''',
  '''<[^>]*[Pp]assword[^>]*>''',
  '''<a low-entropy literal>''',
  '''<a literal default>''',
]

[[allowlists]]
description = """THE BURNED PRODUCTION PASSWORD -- in this repo's history permanently.
Allowlisted for one reason: `git push --force` is deny-listed in this environment, so history
cannot be rewritten, and a gate that can never go green is a gate people route around.
Redaction is NOT the remediation. ROTATION is, and it is operator action #1 in
docs/RESUME-HERE.md.
IMPORTANT, and corrected after review: a gitleaks allowlist applies to EVERY scan mode, not
just history. So this entry also stops gitleaks reporting the value if it is reintroduced into
a new file. Do not read it as history-only protection -- gitleaks will NOT catch a
reintroduction of this specific value.

What catches that is test_no_burned_credential_reappears_in_any_tracked_file in
src/core/tests/test_no_hardcoded_demo_credentials.py, which greps every tracked file, code and
prose, for exactly these burned values. That test is the load-bearing guard here, and it is the
one that would have caught all three times this value came back after being "removed". Never
add a value to that test's allowlist to make it pass."""
# Written as a PATTERN, not the literal, so this file does not itself republish the value --
# which the burned-credential test correctly flagged when it started scanning .toml files.
regexes = ['''backyard-qa-20[0-9]{2}''']

[[rules]]
id = "backyard-unquoted-env-credential-assignment"
description = "A SHOUTY_SNAKE credential name assigned an unquoted literal in env/compose shape"
regex = '''(?m)^[\s-]*[A-Z][A-Z0-9_]*(?:PW|PASSWD|PASSWORD|PASSPHRASE|SECRET|CREDENTIAL)[A-Z0-9_]*\s*[:=][ \t]*([^$\s"'#(\[.<][^\n#(\[]{5,})'''
secretGroup = 1
tags = ["password", "generic", "env"]

[[allowlists]]
# targetRules is the whole point of this block and it was MISSING. A top-level [[allowlists]]
# with no targetRules is GLOBAL in gitleaks 8 — it applies to every rule, including the
# provider-key rules from the default set — while this description claimed it covered "the
# two generic rules". The description was the only thing scoping it, and a description is
# not a scope.
#
# Measured against 8.30.1 before the fix:
#
#   PW = "sunflower-kitchen-tuesday"                        -> leaks found: 1
#   PW = "not-a-secret-sunflower-kitchen"                   -> no leaks found
#   BACKYARD_BACKUP_PASSPHRASE = "correct-not-a-secret-..." -> no leaks found
#
# So any real credential whose VALUE happened to contain that substring was exempt from
# every rule this config runs. (Allowlist regexes match the finding's secret, not the whole
# line, so a marker in a trailing comment does not exempt — verified separately.)
#
# `not-a-secret` stays a substring rather than becoming anchored, because the values it
# legitimately covers embed it mid-string on purpose: `ci-not-a-secret`,
# `ci-backup-passphrase-not-a-secret`, `local-not-a-secret-deadbeef-...`. Anchoring would
# break every CI job. Scoping is the fix; anchoring would have been a different bug.
description = "Structurally-not-a-credential values, for THIS FILE'S two generic rules only."
targetRules = [
  "backyard-generic-password-assignment",
  "backyard-unquoted-env-credential-assignment",
]
regexes = [
  '''not-a-secret''',
  '''^whsec_live$''',
  '''^(os\.environ|sys\.argv|getattr|globals|locals)''',
]
